<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OKF Bundle Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

` | `__aenter__, __aexit__, _isolate_database_url, acquire, fetchval (+6 more)` |\n| `__init__` | `tests/__init__.py` | `-` | `-` |\n\n# Navigation\nXem cac tap tin cau hinh chinh tai [Key Config Files](../codebase/key_files.md).", "domain/business_overview": "# Business Intent & Domain Overview\nD\u1ef1 \u00e1n `gitlab-analytics` ch\u1ee9a **322** code modules va **63** tai lieu Product Spec co san. (Mode: AI Synthesis)\n\n## AI-Reconciled Business Domain Analysis\nD\u01b0\u1edbi \u0111\u00e2y l\u00e0 b\u00e1o c\u00e1o ph\u00e2n t\u00edch v\u00e0 t\u1ed5ng h\u1ee3p to\u00e0n b\u1ed9 h\u1ec7 th\u1ed1ng **`gitlab-analytics`** \u0111\u1ee9ng tr\u00ean g\u00f3c \u0111\u1ed9 **Senior Business Analyst & Software Architect**. B\u00e1o c\u00e1o d\u1ef1a tr\u00ean vi\u1ec7c \u0111\u1ed1i chi\u1ebfu gi\u1eefa to\u00e0n b\u1ed9 T\u00e0i li\u1ec7u Thi\u1ebft k\u1ebf/Specs/Guides v\u00e0 M\u00e3 ngu\u1ed3n th\u1ef1c t\u1ebf c\u1ee7a d\u1ef1 \u00e1n.\n\n---\n\n# I. Quy t\u1eafc Nghi\u1ec7p v\u1ee5 C\u1ed1t l\u00f5i (Core Business Rules & Logic)\n\nM\u1ee5c ti\u00eau c\u1ed1t l\u00f5i c\u1ee7a h\u1ec7 th\u1ed1ng l\u00e0 **t\u1ef1 \u0111\u1ed9ng h\u00f3a gi\u00e1m s\u00e1t tu\u00e2n th\u1ee7 (compliance) quy tr\u00ecnh Git/MR cho 100+ l\u1eadp tr\u00ecnh vi\u00ean** v\u1edbi ngu\u1ed3n l\u1ef1c QA h\u1ea1n ch\u1ebf (<10 ng\u01b0\u1eddi), \u0111\u1ed3ng th\u1eddi theo d\u00f5i c\u00e1c ch\u1ec9 s\u1ed1 hi\u1ec7u su\u1ea5t ph\u00e1t tri\u1ec3n ph\u1ea7n m\u1ec1m **DORA metrics**.\n\n### 1. Thu\u1eadt to\u00e1n T\u00ednh \u0111i\u1ec3m Tu\u00e2n th\u1ee7 MR (MR Compliance Scoring v1.6 / v1.4)\nM\u1ed7i Merge Request (MR) khi t\u1ea1o ra v\u00e0 merge s\u1ebd \u0111\u01b0\u1ee3c ch\u1ea5m tr\u00ean thang \u0111i\u1ec3m **100 \u0111i\u1ec3m** d\u1ef1a tr\u00ean 4 nh\u00f3m ti\u00eau ch\u00ed (10 ti\u00eau ch\u00ed scoring) + 2 ti\u00eau ch\u00ed khuy\u1ebfn ngh\u1ecb (Advisory):\n\n*   **Group 1: Quality Gate (T\u1ed1i \u0111a 35 \u0111i\u1ec3m)**\n    *   `CI_STATUS` (25\u0111): Pipeline CI tr\u00ean nh\u00e1nh m\u1eb7c \u0111\u1ecbnh ho\u1eb7c head pipeline c\u1ee7a MR ph\u1ea3i `passed`.\n    *   `COVERAGE_ABS` (10\u0111): Code coverage tuy\u1ec7t \u0111\u1ed1i \u2265 80% \u0111\u1ea1t 10\u0111; 50\u201379% \u0111\u1ea1t 5\u0111; < 50% \u0111\u1ea1t 0\u0111.\n    *   `COVERAGE_DELTA` (5\u0111): \u0110\u1ed9 bi\u1ebfn \u0111\u1ed9ng coverage kh\u00f4ng b\u1ecb gi\u1ea3m (delta \u2265 0% \u0111\u1ea1t 5\u0111; < 0% \u0111\u1ea1t 0\u0111).\n*   **Group 2: K\u00edch th\u01b0\u1edbc MR / MR Size (T\u1ed1i \u0111a 15 \u0111i\u1ec3m)**\n    *   `MR_SIZE` (15\u0111): T\u1ed5ng LOC thay \u0111\u1ed5i (additions + deletions) \u2264 400 lines (XS/S) \u0111\u1ea1t 15\u0111; \u2264 700 lines (M) \u0111\u1ea1t 8\u0111; > 700 lines (L/XL) \u0111\u1ea1t 0\u0111 (vi ph\u1ea1m `MR_TOO_LARGE`).\n*   **Group 3: M\u00f4 t\u1ea3 & Ng\u1eef c\u1ea3nh / Description & Context (T\u1ed1i \u0111a 25 \u0111i\u1ec3m)**\n    *   `DESCRIPTION_LENGTH` (10\u0111): M\u00f4 t\u1ea3 MR kh\u00f4ng \u0111\u01b0\u1ee3c \u0111\u1ec3 tr\u1ed1ng (\u0111\u1ed9 d\u00e0i \u2265 30 k\u00fd t\u1ef1 ho\u1eb7c \u0111\u00fang template).\n    *   `TICKET_REF` (10\u0111): Ph\u1ea3i ch\u1ee9a tham chi\u1ebfu Ticket/Issue (vd: `[#JIRA-123]`, `#123`).\n    *   `AI_DISCLOSURE` (5\u0111): Khai b\u00e1o s\u1eed d\u1ee5ng AI n\u1ebfu c\u00f3 commit ch\u1ee9a AI (tag `[AI]` trong commit message ho\u1eb7c t\u00edch ch\u1ecdn AI Disclosure).\n*   **Group 4: Quy chu\u1ea9n Git & Commit / Git Hygiene (T\u1ed1i \u0111a 25 \u0111i\u1ec3m)**\n    *   `BRANCH_NAME` (10\u0111): T\u00ean nh\u00e1nh ph\u1ea3i tu\u00e2n th\u1ee7 convention (`feature/*`, `bugfix/*`, `hotfix/*`, `refactor/*`, `chore/*`).\n    *   `CONVENTIONAL_TITLE` (10\u0111): Ti\u00eau \u0111\u1ec1 MR tu\u00e2n th\u1ee7 Conventional Commits (`feat:`, `fix:`, `refactor:`, `docs:`, ...).\n    *   `COMMIT_HYGIENE` (5\u0111): S\u1ed1 l\u01b0\u1ee3ng commit h\u1ee3p l\u00fd (\u2264 5 commits/MR ho\u1eb7c commit message tu\u00e2n th\u1ee7 chu\u1ea9n).\n*   **Advisory Criteria (0 \u0111i\u1ec3m tr\u1eeb, d\u00f9ng c\u1ea3nh b\u00e1o/gi\u00e1m s\u00e1t):**\n    *   `NO_SCREENSHOTS_UI` (R-MR-005): MR \u0111\u1ee5ng ch\u1ea1m UI/Frontend b\u1eaft bu\u1ed9c c\u00f3 screenshot/GIF.\n    *   `NOT_REBASED` (R-MR-006): MR ph\u1ea3i \u0111\u01b0\u1ee3c rebase v\u1edbi nh\u00e1nh \u0111\u00edch tr\u01b0\u1edbc khi merge.\n\n**Ph\u00e2n lo\u1ea1i Grade:**\n*   **PASS**: Score \u2265 80\n*   **WARNING**: Score t\u1eeb 60 \u0111\u1ebfn 79\n*   **FAIL**: Score < 60 (T\u1ef1 \u0111\u1ed9ng k\u00edch ho\u1ea1t c\u1ea3nh b\u00e1o t\u1edbi Slack)\n\n### 2. Ti\u00eau ch\u00ed DORA Metrics (DORA 4 Key Metrics)\nT\u1ef1 \u0111\u1ed9ng t\u00ednh to\u00e1n theo tu\u1ea7n v\u00e0 d\u1ef1 \u00e1n (`v_dora_metrics.sql`):\n1.  **Deployment Frequency (DF)**: S\u1ed1 l\u01b0\u1ee3ng pipeline ch\u1ea1y th\u00e0nh c\u00f4ng tr\u00ean nh\u00e1nh m\u1eb7c \u0111\u1ecbnh (`main`/`master`) theo tu\u1ea7n.\n2.  **Lead Time for Changes (LTC)**: Th\u1eddi gian t\u1eeb commit \u0111\u1ea7u ti\u00ean \u0111\u1ebfn khi MR \u0111\u01b0\u1ee3c merge th\u00e0nh c\u00f4ng (truy xu\u1ea5t qua c\u1ea7u n\u1ed1i `stg_mr_commits`).\n3.  **Change Failure Rate (CFR)**: T\u1ef7 l\u1ec7 pipeline th\u1ea5t b\u1ea1i so v\u1edbi t\u1ed5ng s\u1ed1 pipeline tri\u1ec3n khai.\n4.  **Time to Restore Service (MTTR)**: Th\u1eddi gian trung b\u00ecnh kh\u1eafc ph\u1ee5c s\u1ef1 c\u1ed1 (t\u00ednh t\u1eeb pipeline l\u1ed7i \u0111\u1ebfn pipeline th\u00e0nh c\u00f4ng ti\u1ebfp theo).\n\n### 3. Quy t\u1eafc V\u1eadn h\u00e0nh Data Pipeline & Alerting\n*   **Th\u1ee9 t\u1ef1 ETL Incremental**: Ch\u1ea1y c\u00e0o d\u1eef li\u1ec7u qua `dlt` (write disposition = `merge`) \u2192 C\u1eadp nh\u1eadt watermark/cursor v\u00e0o `gitlab_raw.pipeline_state` \u2192 Ch\u1ea1y `dbt run` bi\u1ebfn \u0111\u1ed5i sang schema `gitlab_kpi` \u2192 Ch\u1ea1y `compliance_alert.py` \u0111\u1ec3 g\u1eedi th\u00f4ng b\u00e1o.\n*   **Deduplication Alert**: C\u1ea3nh b\u00e1o vi ph\u1ea1m Slack \u0111\u01b0\u1ee3c kh\u1eed tr\u00f9ng l\u1eb7p (ch\u1ec9 g\u1eedi 1 l\u1ea7n cho t\u1eebng MR ID vi ph\u1ea1m) nh\u1edd l\u01b0u tr\u1ea1ng th\u00e1i g\u1eedi v\u00e0o b\u1ea3ng DB / file checkpoint.\n*   **System Freshness SLA**: N\u1ebfu d\u1eef li\u1ec7u c\u00e0o mu\u1ed9n qu\u00e1 24h ho\u1eb7c ETL l\u1ed7i li\u00ean ti\u1ebfp \u2265 3 l\u1ea7n (`consecutive_failures >= 3`), h\u1ec7 th\u1ed1ng t\u1ef1 \u0111\u1ed9ng b\u1eafn c\u1ea3nh b\u00e1o **Freshness Alert** (`freshness_alert.py`) l\u00ean k\u00eanh Slack v\u1eadn h\u00e0nh.\n\n---\n\n# II. \u0110\u1ed1i chi\u1ebfu gi\u1eefa Spec (T\u00e0i li\u1ec7u) v\u00e0 Codebase (M\u00e3 ngu\u1ed3n th\u1ef1c t\u1ebf)\n\nSau khi \u0111\u1ecdc v\u00e0 so s\u00e1nh to\u00e0n b\u1ed9 file t\u00e0i li\u1ec7u v\u00e0 m\u00e3 ngu\u1ed3n, d\u01b0\u1edbi \u0111\u00e2y l\u00e0 b\u1ea3ng t\u1ed5ng h\u1ee3p m\u1ee9c \u0111\u1ed9 kh\u1edbp (Alignment Gap Analysis):\n\n### 1. \u0110i\u1ec3m Kh\u1edbp Ho\u00e0n H\u1ea3o (100% Implemented)\n*   **Ki\u1ebfn tr\u00fac Data 3 Layers**:\n    *   `gitlab_raw` (dlt extraction) \u2192 `gitlab_kpi_staging` (dbt `stg_*` views) \u2192 `gitlab_kpi` (dbt marts `v_*`). Kh\u1edbp ho\u00e0n to\u00e0n gi\u1eefa SDD, DB ERD v\u00e0 m\u00e3 ngu\u1ed3n trong `src/transform/models/`.\n*   **C\u01a1 ch\u1ebf Chuy\u1ec3n \u0111\u1ed5i Spec th\u00e0nh Code (`compliance_updater`)**:\n    *   M\u00e3 ngu\u1ed3n `src/compliance_updater/` \u0111\u1ecdc tr\u1ef1c ti\u1ebfp file c\u1ea5u h\u00ecnh `docs/mr-compliance/compliance_spec.yaml` (v1.6) \u0111\u1ec3 t\u1ef1 \u0111\u1ed9ng sinh m\u00e3 SQL trong `v_mr_compliance.sql`, `v_compliance_violation_detail.sql` v\u00e0 sinh h\u1eb1ng s\u1ed1 Python `src/alerting/thresholds.py`. Spec t\u00e0i li\u1ec7u v\u00e0 code tri\u1ec3n khai \u0111\u1ed3ng b\u1ed9 ho\u00e0n to\u00e0n th\u00f4ng qua c\u01a1 ch\u1ebf code-generation n\u00e0y.\n*   **Metabase Auto-Provisioning (Dashboard Collections A\u2013F)**:\n    *   File script `src/metabase/setup_dashboards.py` t\u1ef1 \u0111\u1ed9ng \u0111\u1ecbnh ngh\u0129a v\u00e0 kh\u1edfi t\u1ea1o \u0111\u00fang **53\u201355 dashboard cards** qua REST API tr\u00ean 6 collections (A: Ops Health, B: QA Compliance, C: Eng Management, D: Deep Dive, E: Formula Transparency, F: KPI Control Panel) \u0111\u00fang nh\u01b0 m\u00f4 t\u1ea3 trong `docs/guides/dashboard_catalog.md` v\u00e0 `docs/dashboard_queries/`.\n*   **Partitioning Data Strategy (DB Archive Strategy Phase 2)**:\n    *   C\u00e1c migration SQL `010_pipeline_jobs_created_at_timestamptz.sql`, `011_pipeline_jobs_partition.sql`, `012_pipelines_partition.sql`, `013_commits_partition.sql` tri\u1ec3n khai ch\u00ednh x\u00e1c chi\u1ebfn l\u01b0\u1ee3c Range Partitioning theo th\u00e1ng \u0111\u00fang nh\u01b0 \u0111\u1ec1 xu\u1ea5t trong `docs/ops/DB_ARCHIVE_STRATEGY.md`.\n\n### 2. \u0110i\u1ec3m Kh\u00e1c bi\u1ec7t & Gap gi\u1eefa Spec v\u00e0 Th\u1ef1c t\u1ebf Codebase\n\n| H\u1ea1ng m\u1ee5c Spec | Tr\u1ea1ng th\u00e1i trong T\u00e0i li\u1ec7u / Spec | Th\u1ef1c t\u1ebf trong Codebase | \u0110\u00e1nh gi\u00e1 / Nguy\u00ean nh\u00e2n (Gap Analysis) |\n| :--- | :--- | :--- | :--- |\n| **P2 Phase A v1.6 (Screenshots & Rebase)** | \u0110\u00e3 \u0111\u01b0a v\u00e0o `compliance_spec.yaml` v1.6 & Migration `014` | Migration 014 \u0111\u00e3 th\u00eam column `has_screenshots`, `diverged_commits_count`, `is_ui_related` v\u00e0o `merge_requests`. Nh\u01b0ng d\u1eef li\u1ec7u c\u00e0o ch\u01b0a c\u00f3 backfill | **In-Progress / Data Gap**: D\u1eef li\u1ec7u l\u1ecbch s\u1eed b\u1ecb `NULL` ho\u1eb7c `false` do API c\u0169 ch\u01b0a c\u00e0o param `include_diverged_commits_count=true`. \u0110ang ch\u1edd re-extract (`v1.6_ci_quality_gate_plan.md`). |\n| **Real-time Webhook Engine** | SDD & PRD n\u00eau Webhook nh\u1eadn event th\u1eddi gian th\u1ef1c song song v\u1edbi Batch ETL | \u0110\u00e3 vi\u1ebft codebase `src/webhook/` (FastAPI + Asyncpg + `webhook_dlq`), nh\u01b0ng deploy k8s hi\u1ec7n t\u1ea1i ghi nh\u1eadn l\u00e0 P2 (optional) | **Partial Implementation**: Codebase \u0111\u00e3 ho\u00e0n th\u00e0nh 100% bao g\u1ed3m c\u1ea3 Dead Letter Queue (DLQ), nh\u01b0ng ch\u01b0a \u0111\u01b0\u1ee3c b\u1eadt ch\u00ednh th\u1ee9c tr\u00ean m\u00f4i tr\u01b0\u1eddng Production do DevOps \u01b0u ti\u00ean K8s CronJob. |\n| **Reviewer & Approval Compliance** | PRD y\u00eau c\u1ea7u \u0111o l\u01b0\u1eddng ch\u1ea5t l\u01b0\u1ee3ng Reviewer v\u00e0 t\u00ednh th\u1eddi gian duy\u1ec7t MR | \u0110\u00e3 c\u00e0o d\u1eef li\u1ec7u qua DIP Phase 1 & 2 (`stg_mr_notes.sql`, `v_review_quality.sql`). Nh\u01b0ng b\u00e1o c\u00e1o ghi nh\u1eadn ~0% MRs d\u00f9ng reviewer | **Spec vs Operational Reality**: Code \u0111\u00e3 h\u1ed7 tr\u1ee3 \u0111\u1ea7y \u0111\u1ee7, nh\u01b0ng th\u1ef1c t\u1ebf c\u00e1c team Dev ch\u01b0a subscribe quy tr\u00ecnh Assign Reviewer tr\u00ean GitLab UI (`dip_phase1_done.md`). System chuy\u1ec3n sang fallback t\u1ef1 \u0111\u1ed9ng. |\n| **Metabase Dev Infrastructure** | Spec y\u00eau c\u1ea7u Metabase ph\u1ee5c v\u1ee5 QA/Management 24/7 | B\u00e1o c\u00e1o RCA (`RCA-metabase-dev-2026-07-21.md`) ch\u1ec9 ra Metabase dev b\u1ecb crash-loop do c3p0 pool timeout & resource limits | **Infrastructure Debt**: \u0110\u00e3 c\u00f3 k\u1ebf ho\u1ea1ch kh\u1eafc ph\u1ee5c t\u1ea1m th\u1eddi (workaround), c\u1ea7n DevOps/DBA c\u1ea5u h\u00ecnh chu\u1ea9n l\u1ea1i K8s limits v\u00e0 DB connection string. |\n\n---\n\n# III. C\u00e1c Mi\u1ec1n Ch\u1ee9c n\u0103ng Ch\u00ednh (Domain Subsystems)\n\nH\u1ec7 th\u1ed1ng \u0111\u01b0\u1ee3c chia l\u00e0m **7 mi\u1ec1n ch\u1ee9c n\u0103ng ch\u00ednh (Subsystems)** v\u1edbi ranh gi\u1edbi tr\u00e1ch nhi\u1ec7m (bounded context) v\u00e0 lu\u1ed3ng d\u1eef li\u1ec7u minh b\u1ea1ch:\n\n```\n[GitLab API / Webhook]\n       \u2502\n       \u251c\u2500\u2500\u25ba 1. Extractor / Ingestion Subsystem (dlt + API Client)\n       \u2502         \u2502 (validate payload)\n       \u2502         \u25bc\n       \u2502    2. Data Validation Subsystem (Pydantic + Schema Checks)\n       \u2502         \u2502 (write raw)\n       \u2502         \u25bc\n       \u2502    [PostgreSQL: gitlab_raw]\n       \u2502         \u2502\n       \u2502         \u25bc\n       \u2502    3. Transformation Subsystem (dbt Core: staging -> marts)\n       \u2502         \u25b2\n       \u2502         \u2502 (sync SQL / rules)\n       \u2502    4. Compliance Updater Subsystem (compliance_spec.yaml Engine)\n       \u2502         \u2502\n       \u2502         \u25bc\n       \u2502    [PostgreSQL: gitlab_kpi]\n       \u2502         \u2502\n       \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n       \u2502         \u25bc                       \u25bc\n       \u2502    5. Alerter Subsystem    6. Visualization Subsystem\n       \u2502    (Slack Notifications)   (Metabase REST / Dashboards)\n       \u2502\n       \u2514\u2500\u2500\u25ba 7. Webhook Real-time Subsystem (FastAPI Receiver)\n```\n\n### 1. Extraction / Ingestion Subsystem (`src/extraction/`)\n*   **Th\u00e0nh ph\u1ea7n ch\u00ednh**: `GitLabClient` (`client.py`), `pipeline.py`, c\u00e1c dlt resource (`merge_requests.py`, `commits.py`, `pipelines.py`, `mr_commits.py`, `mr_notes.py`, `group_members.py`, `pipeline_jobs.py`, `test_reports.py`), `checkpoint.py`.\n*   **Tr\u00e1ch nhi\u1ec7m**:\n    *   G\u1ecdi REST API v4 c\u1ee7a GitLab, x\u1eed l\u00fd ph\u00e2n trang (`per_page=100`), Rate Limiting v\u00e0 Exponential Backoff Retry.\n    *   S\u1eed d\u1ee5ng framework `dlt` \u0111\u1ec3 \u0111\u1ea9y d\u1eef li\u1ec7u th\u00f4 v\u00e0o schema `gitlab_raw` theo ch\u1ebf \u0111\u1ed9 `write_disposition=\"merge\"`.\n    *   L\u01b0u gi\u1eef \u0111i\u1ec3m d\u1eebng (cursor/watermark) v\u00e0o b\u1ea3ng `gitlab_raw.pipeline_state` \u0111\u1ec3 ph\u1ee5c v\u1ee5 c\u00e0o t\u0103ng ti\u1ebfn (incremental sync).\n\n### 2. Data Validation & Quality Subsystem (`src/validation/`)\n*   **Th\u00e0nh ph\u1ea7n ch\u00ednh**: `schema_validator.py` (Pydantic Models), `data_quality.py`, `idempotency.py`.\n*   **Tr\u00e1ch nhi\u1ec7m**:\n    *   Ki\u1ec3m tra c\u1ea5u tr\u00fac d\u1eef li\u1ec7u API tr\u1ea3 v\u1ec1 so v\u1edbi `schema_snapshot.yaml` tr\u01b0\u1edbc khi ghi xu\u1ed1ng DB (\u0111\u00f3ng vai tr\u00f2 Anti-Hallucination / Quality Gate ph\u00f2ng ng\u1eeba API drift).\n    *   Ph\u00e1t hi\u1ec7n c\u00e1c b\u1ea5t th\u01b0\u1eddng v\u1ec1 d\u1eef li\u1ec7u (nh\u01b0 s\u1ed1 d\u00f2ng th\u00eam `additions < 0` ho\u1eb7c timestamp kh\u00f4ng h\u1ee3p l\u1ec7).\n\n### 3. Transformation Subsystem / dbt Engine (`src/transform/`)\n*   **Th\u00e0nh ph\u1ea7n ch\u00ednh**: C\u00e1c dbt models bao g\u1ed3m l\u1edbp **Staging** (`stg_*`) v\u00e0 l\u1edbp **Marts** (`v_mr_compliance`, `v_compliance_mgmt`, `v_weekly_kpi`, `v_team_leaderboard`, `v_dora_metrics`, `dim_user`, `v_kpi_control_panel`).\n*   **Tr\u00e1ch nhi\u1ec7m**:\n    *   Chuy\u1ec3n \u0111\u1ed5i, l\u00e0m s\u1ea1ch d\u1eef li\u1ec7u t\u1eeb `gitlab_raw` sang `gitlab_kpi_staging`.\n    *   Ch\u1ea1y logic t\u00ednh \u0111i\u1ec3m tu\u00e2n th\u1ee7 ph\u1ee9c t\u1ea1p, t\u00ednh to\u00e1n ch\u1ec9 s\u1ed1 DORA, chu\u1ea9n h\u00f3a danh t\u00ednh l\u1eadp tr\u00ecnh vi\u00ean (`dim_user.sql`) v\u00e0 t\u1ed5ng h\u1ee3p KPI theo tu\u1ea7n/th\u00e1ng/d\u1ef1 \u00e1n trong `gitlab_kpi`.\n\n### 4. Compliance Specification & Updater Subsystem (`src/compliance_updater/`)\n*   **Th\u00e0nh ph\u1ea7n ch\u00ednh**: `compliance_spec.yaml`, `parser.py`, `generator.py`, `applier.py`, `cli.py`.\n*   **Tr\u00e1ch nhi\u1ec7m**:\n    *   \u0110\u00f3ng vai tr\u00f2 Single Source of Truth cho to\u00e0n b\u1ed9 quy t\u1eafc tu\u00e2n th\u1ee7.\n    *   Khi quy \u0111\u1ecbnh QA thay \u0111\u1ed5i (vd n\u00e2ng/h\u1ea1 tr\u1ecdng s\u1ed1, th\u00eam ti\u00eau ch\u00ed m\u1edbi), CLI `compliance_updater` s\u1ebd parse YAML v\u00e0 t\u1ef1 \u0111\u1ed9ng inject l\u1ea1i \u0111o\u1ea1n SQL t\u01b0\u01a1ng \u1ee9ng v\u00e0o dbt models (`v_mr_compliance.sql`, `v_compliance_violation_detail.sql`) v\u00e0 c\u1eadp nh\u1eadt file `thresholds.py`.\n\n### 5. Alerting & Reporting Subsystem (`src/alerting/`, `src/reporting/`)\n*   **Th\u00e0nh ph\u1ea7n ch\u00ednh**: `compliance_alert.py`, `freshness_alert.py`, `slack_client.py`, `daily_insight.py`.\n*   **Tr\u00e1ch nhi\u1ec7m**:\n    *   Truy v\u1ea5n view `gitlab_kpi.v_violations` sau m\u1ed7i l\u01b0\u1ee3t dbt transform \u0111\u1ec3 l\u1ecdc c\u00e1c MR vi ph\u1ea1m.\n    *   Format th\u00f4ng b\u00e1o d\u01b0\u1edbi d\u1ea1ng Slack Block Kit chuy\u00ean nghi\u1ec7p v\u00e0 g\u1eedi t\u1edbi c\u00e1c k\u00eanh Slack t\u01b0\u01a1ng \u1ee9ng.\n    *   Th\u1ef1c hi\u1ec7n gi\u00e1m s\u00e1t SLA \u0111\u1ed9 t\u01b0\u01a1i c\u1ee7a d\u1eef li\u1ec7u (Data Freshness Monitoring) v\u00e0 g\u1eedi b\u00e1o c\u00e1o Daily Insight.\n\n### 6. Real-time Webhook Receiver Subsystem (`src/webhook/`)\n*   **Th\u00e0nh ph\u1ea7n ch\u00ednh**: `app.py` (FastAPI), `handlers.py` (Asyncpg pool), `validator.py`, b\u1ea3ng `gitlab_raw.webhook_dlq`.\n*   **Tr\u00e1ch nhi\u1ec7m**:\n    *   L\u1eafng nghe c\u00e1c s\u1ef1 ki\u1ec7n POST t\u1eeb GitLab Webhook (Push events, MR events, Pipeline events).\n    *   Ki\u1ec3m tra t\u00ednh h\u1ee3p l\u1ec7 c\u1ee7a Token (`X-Gitlab-Token`).\n    *   Ghi d\u1eef li\u1ec7u ngay l\u1eadp t\u1ee9c v\u00e0o DB. N\u1ebfu c\u00f3 l\u1ed7i, \u0111\u1ea9y event v\u00e0o Dead Letter Queue (`webhook_dlq`) \u0111\u1ec3 ph\u1ee5c v\u1ee5 th\u1ee7 t\u1ee5c replay tay.\n\n### 7. Visualization & Ops Management Subsystem (`src/metabase/`)\n*   **Th\u00e0nh ph\u1ea7n ch\u00ednh**: `src/metabase/setup_dashboards.py`, b\u1ed9 SQL queries trong `docs/dashboard_queries/`.\n*   **Tr\u00e1ch nhi\u1ec7m**:\n    *   T\u1ef1 \u0111\u1ed9ng kh\u1edfi t\u1ea1o, c\u1ea5u h\u00ecnh v\u00e0 \u0111\u1ed3ng b\u1ed9 h\u1ec7 th\u1ed1ng Dashboard tr\u00ean Metabase via REST API.\n    *   Cung c\u1ea5p giao di\u1ec7n tr\u1ef1c quan h\u00f3a cho 4 \u0111\u1ed1i t\u01b0\u1ee3ng ng\u01b0\u1eddi d\u00f9ng ch\u00ednh: Engineering Manager, QA Lead, Developer (self-service) v\u00e0 DevOps on-call.\n\n---\n\n# IV. Khuy\u1ebfn ngh\u1ecb K\u1ef9 thu\u1eadt t\u1eeb Architect (Architectural Recommendations)\n\n1.  **D\u1ecdn d\u1eb9p Infrastructure Debt**:\n    *   Kh\u1ea9n tr\u01b0\u01a1ng \u0111\u01b0a c\u00e1c tham s\u1ed1 c\u1ea5u h\u00ecnh Metabase (`JAVA_OPTS`, C3P0 connection pool, K8s CPU/RAM limits) v\u00e0o GitOps Repository (ArgoCD) \u0111\u1ec3 tr\u00e1nh vi\u1ec7c ArgoCD sync \u0111\u00e8 l\u00e0m t\u00e1i di\u1ec5n l\u1ed7i Crash-Loop.\n2.  **Backfill d\u1eef li\u1ec7u Phase A v1.6**:\n    *   Th\u1ef1c hi\u1ec7n re-extract cho 26,000+ MRs hi\u1ec7n t\u1ea1i v\u1edbi tham s\u1ed1 `include_diverged_commits_count=true` \u0111\u1ec3 populate d\u1eef li\u1ec7u cho 2 card B14 & B15 \u0111ang b\u1ecb tr\u1ed1ng tr\u00ean Dashboard Collection B.\n3.  **K\u00edch ho\u1ea1t Webhook Subsystem (Phase 2)**:\n    *   Chuy\u1ec3n lu\u1ed3ng Webhook Receiver t\u1eeb tr\u1ea1ng th\u00e1i ch\u1edd (P2) sang ho\u1ea1t \u0111\u1ed9ng ch\u00ednh th\u1ee9c tr\u00ean K8s \u0111\u1ec3 \u0111\u1ea1t m\u1ee5c ti\u00eau ph\u1ea3n h\u1ed3i c\u1ea3nh b\u00e1o vi ph\u1ea1m MR theo th\u1eddi gian th\u1ef1c (Real-time Alerting) thay v\u00ec ph\u1ea3i \u0111\u1ee3i \u0111\u1ee3t CronJob Batch ch\u1ea1y l\u00fac 02:00 AM h\u00e0ng ng\u00e0y.\n\nXem chi tiet danh sach tai lieu spec goc tai [Product Specs](../domain/existing_specs_summary.md).\n\n# Associated Schemas\nCac thuc the CSDL lien quan duoc mo ta tai [Database Schemas](../domain/entities.md).", "domain/entities": "# Database Schemas\nT\u1ed5ng s\u1ed1 th\u1ef1c th\u1ec3/b\u1ea3ng d\u1eef li\u1ec7u ph\u00e1t hi\u1ec7n: **12**.\n\n| Entity Name | Source Schema File | Type |\n|-------------|--------------------|------|\n| `webhook_dlq` | `src/infra/db/migrations/002_webhook_dlq.sql` | Database Table |\n| `pipeline_state` | `src/infra/db/migrations/003_pipeline_stat s://www.cognitect.com/blog/2011/11/15/documenting-architecture-decisions |\n| **[FORMAT AND STRUCTURE OF DECISION RECORDS](source_docs/src/transform/dbt_packages/dbt_utils/docs/decisions/adr-0001-decision-record-format.md)** | `src/transform/dbt_packages/dbt_utils/docs/decisions/adr-0001-decision-record-format.md` | `decisions` | We previousy decicded to record any decisions made in this project using Nygard's architecture decision record (ADR) format. Should we continue with this format or adopt an alternative? |\n| **[The future of `dbt_utils` - break it into more logical chunks](source_docs/src/transform/dbt_packages/dbt_utils/docs/decisions/adr-0002-cross-database-utils.md)** | `src/transform/dbt_packages/dbt_utils/docs/decisions/adr-0002-cross-database-utils.md` | `decisions` | --- |\n| **[Readme](source_docs/src/transform/dbt_packages/dbt_utils/docs/decisions/README.md)** | `src/transform/dbt_packages/dbt_utils/docs/decisions/README.md` | `decisions` | For any architectural/engineering decisions we make, we will create an [ADR (Architectural Decision Record)](https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions) to keep track ... |\n\n# Reconciled Business Logic\nN\u1ed9i dung c\u00e1c t\u00e0i li\u1ec7u spec tr\u00ean \u0111\u00e3 \u0111\u01b0\u1ee3c \u0111\u1ed1i chi\u1ebfu v\u1edbi m\u00e3 ngu\u1ed3n t\u1ea1i [T\u1ed5ng quan Nghi\u1ec7p v\u1ee5](../domain/business_overview.md).", "governance/legacy_caveats": "# Legacy Caveats\nCac diem di biet can luu y danh cho ky su moi onboarding:\n\n1. **Bao ton API Contracts**: Khong tu y sua doi tham so API ma khong cap nhat [API Surface](../architecture/api_surface.md).\n2. **Tuan thu CSDL**: Tat ca thay doi Schema can doi chieu voi [Database Entities](../domain/entities.md).\n3. **CI/CD Review**: Cap nhat PR phai di kem cap nhat tri thuc OKF.\n\n# Related Concepts\nQuay lai [No Ky Thuat](../governance/technical_debt.md).", "governance/technical_debt": "# Technical Debt & Vulnerability Assessment\nPhan tich cac vung ma nguon legacy can chu y khi refactor:\n\n## AI-Generated Risk & Debt Audit\nD\u01b0\u1edbi \u0111\u00e2y l\u00e0 b\u00e1o c\u00e1o ph\u00e2n t\u00edch **N\u1ee3 k\u1ef9 thu\u1eadt (Technical Debt)**, **\u0110i\u1ec3m r\u1ee7i ro (Risk Assessment)** v\u00e0 **Khuy\u1ebfn ngh\u1ecb cho K\u1ef9 s\u01b0 m\u1edbi (Onboarding Guidelines)** cho d\u1ef1 \u00e1n legacy `gitlab-analytics`.\n\n---\n\n# I. B\u00c1O C\u00c1O PH\u00c2N T\u00cdCH N\u1ee2 K\u1ef8 THU\u1eacT (TECHNICAL DEBT)\n\nD\u1ef1a tr\u00ean c\u1ea5u tr\u00fac 322 modules v\u00e0 c\u00e1c th\u01b0 vi\u1ec7n \u0111ang s\u1eed d\u1ee5ng, d\u1ef1 \u00e1n mang nhi\u1ec1u \u0111\u1eb7c tr\u01b0ng c\u1ee7a m\u1ed9t h\u1ec7 th\u1ed1ng Data/Analytics Pipeline n\u00e2ng cao nh\u01b0ng \u0111ang g\u00e1nh ch\u1ecbu n\u1ee3 k\u1ef9 thu\u1eadt l\u1edbn v\u1ec1 **ki\u1ebfn tr\u00fac \u0111\u1ed3ng b\u1ed9/b\u1ea5t \u0111\u1ed3ng b\u1ed9**, **ph\u1ee5 thu\u1ed9c th\u01b0 vi\u1ec7n ch\u1ed3ng ch\u00e9o** v\u00e0 **s\u1ef1 ph\u00ecnh to c\u1ee7a tooling n\u1ed9i b\u1ed9 (Over-automation)**.\n\n### 1. Xung \u0111\u1ed9t Ki\u1ebfn tr\u00fac Async vs Sync (Tech Stack Friction)\n*   **Th\u01b0 vi\u1ec7n HTTP:** D\u1ef1 \u00e1n d\u00f9ng song song c\u1ea3 `requests` (Sync) v\u00e0 `httpx` (Async/Sync).\n*   **Th\u01b0 vi\u1ec7n Database:** D\u00f9ng c\u1ea3 `asyncpg` (Async) v\u00e0 `psycopg2-binary` (Sync).\n*   **R\u1ee7i ro:** Vi\u1ec7c tr\u1ed9n l\u1eabn m\u00e3 b\u1ea5t \u0111\u1ed3ng b\u1ed9 (FastAPI, `asyncpg`, `httpx`) v\u00e0 m\u00e3 \u0111\u1ed3ng b\u1ed9 (`requests`, `psycopg2`) r\u1ea5t d\u1ec5 d\u1eabn \u0111\u1ebfn hi\u1ec7n t\u01b0\u1ee3ng **Event Loop Blocking** (ngh\u1ebdn lu\u1ed3ng x\u1eed l\u00fd async trong FastAPI) ho\u1eb7c r\u00f2 r\u1ec9 k\u1ebft n\u1ed1i Database Connection Pool n\u1ebfu kh\u00f4ng qu\u1ea3n l\u00fd c\u1ea9n th\u1eadn.\n\n### 2. S\u1ef1 ph\u00ecnh to v\u00e0 tr\u00f9ng l\u1eb7p Tooling Custom (`.claude/` Ecosystem)\n*   Chi\u1ebfm s\u1ed1 l\u01b0\u1ee3ng module r\u1ea5t l\u1edbn trong t\u1ed5ng s\u1ed1 322 modules.\n*   **T\u1ed3n t\u1ea1i m\u00e3 ngu\u1ed3n song song 2 ng\u00f4n ng\u1eef:** Th\u1ea5y r\u00f5 s\u1ef1 tr\u00f9ng l\u1eb7p gi\u1eefa Node.js v\u00e0 Python trong th\u01b0 m\u1ee5c `.claude/hooks/` (v\u00ed d\u1ee5: `halluc-score.js` vs `halluc-score.py`, `post-write-check.js` vs `post-write-check.py`).\n*   **T\u00e1c \u0111\u1ed9ng:** T\u1ea1o ra th\u00eam chi ph\u00ed b\u1ea3o tr\u00ec (Maintenance Overhead). M\u1ed9t thay \u0111\u1ed5i trong logic ki\u1ec3m tra c\u00f3 th\u1ec3 ph\u1ea3i s\u1eeda \u1edf c\u1ea3 JS v\u00e0 Python script. g\u00e2y hoang mang cho dev m\u1edbi khi ph\u1ea3i t\u00ecm hi\u1ec3u h\u1ec7 th\u1ed1ng hook qu\u00e1 ph\u1ee9c t\u1ea1p.\n\n### 3. Code Smell & Thi\u1ebft k\u1ebf Procedural (M\u00e3 d\u1ea1ng th\u1ee7 t\u1ee5c)\n*   T\u1ec7p `ops.py` c\u00f3 k\u00edch th\u01b0\u1edbc **21 KB** v\u1edbi **23 h\u00e0m nh\u01b0ng 0 Class**. \u0110\u00e2y l\u00e0 d\u1ea5u hi\u1ec7u c\u1ee7a \"God Script\" (T\u1ec7p l\u00e0m qu\u00e1 nhi\u1ec1u vi\u1ec7c th\u1ee7 t\u1ee5c), kh\u00f3 unit test \u0111\u1ed9c l\u1eadp, d\u1ec5 vi ph\u1ea1m nguy\u00ean l\u00fd Single Responsibility.\n*   Thi\u1ebfu c\u00e1c c\u1ea5u tr\u00fac OOP/Abstraction trong c\u00e1c t\u1ec7p v\u1eadn h\u00e0nh ch\u00ednh.\n\n### 4. R\u1ee7i ro Ph\u1ee5 thu\u1ed9c Th\u01b0 vi\u1ec7n (Dependencies Debt)\n*   `psycopg2-binary`: Nh\u00e0 ph\u00e1t tri\u1ec3n `psycopg2` ch\u00ednh th\u1ee9c c\u1ea3nh b\u00e1o **kh\u00f4ng n\u00ean d\u00f9ng b\u1ea3n `-binary` tr\u00ean Production** do v\u1ea5n \u0111\u1ec1 li\u00ean k\u1ebft th\u01b0 vi\u1ec7n C (SSL/TLS libraries crash ho\u1eb7c segfault tr\u00ean c\u00e1c m\u00f4i tr\u01b0\u1eddng Linux kh\u00e1c nhau).\n*   K\u1ebft h\u1ee3p `dlt` (data load tool) + `dbt-postgres`: Vi\u1ec7c \u0111\u1ea9y d\u1eef li\u1ec7u ETL/ELT \u0111ang d\u1ef1a nhi\u1ec1u v\u00e0o c\u00e1c script ki\u1ec3m tra sai l\u1ec7ch schema custom (`drift_check.py`, `check-drift.md`), ch\u1ee9ng t\u1ecf pipeline d\u1eef li\u1ec7u ch\u01b0a th\u1ef1c s\u1ef1 \u1ed5n \u0111\u1ecbnh t\u1ef1 \u0111\u1ed9ng.\n\n---\n\n# II. \u0110\u00c1NH GI\u00c1 \u0110I\u1ec2M R\u1ee6I RO (RISK SCORECARD)\n\n| Ti\u00eau ch\u00ed r\u1ee7i ro | M\u1ee9c \u0111\u1ed9 | \u0110i\u1ec3m (1-10) | M\u00f4 t\u1ea3 chi ti\u1ebft |\n| :--- | :---: | :---: | :--- |\n| **R\u1ee7i ro M\u00f4i tr\u01b0\u1eddng & Ch\u1ea1y Local** | **R\u1ea5t cao** | **8.5/10** | T\u1ec7p `LOCAL_SETUP.md` d\u00e0i g\u1ea7n 49KB + h\u1ec7 th\u1ed1ng Custom Hooks ph\u1ee9c t\u1ea1p d\u1ec5 khi\u1ebfn Dev m\u1edbi m\u1ea5t 2-3 ng\u00e0y kh\u00f4ng ch\u1ea1y n\u1ed5i m\u00f4i tr\u01b0\u1eddng local. |\n| **R\u1ee7i ro V\u1eadn h\u00e0nh Pipeline (Data Reliability)** | **Cao** | **7.5/10** | Xung \u0111\u1ed9t driver DB (Async/Sync) v\u00e0 r\u1ee7i ro Schema Drift t\u1eeb GitLab API thay \u0111\u1ed5i. |\n| **R\u1ee7i ro B\u1ea3o tr\u00ec Codebase (Maintainability)** | **Cao** | **7.0/10** | T\u1ed3n t\u1ea1i code tr\u00f9ng l\u1eb7p (JS/Python), nhi\u1ec1u file markdown \u0111\u00f3ng vai tr\u00f2 command/agent ch\u01b0a r\u00f5 r\u00e0ng. |\n| **R\u1ee7i ro Hi\u1ec7u n\u0103ng (Performance)** | **Trung b\u00ecnh** | **6.0/10** | S\u1eed d\u1ee5ng `psycopg2-binary` v\u00e0 nguy c\u01a1 block event loop do g\u1ecdi th\u01b0 vi\u1ec7n sync trong route FastAPI. |\n\n**\u0110I\u1ec2M R\u1ee6I RO T\u1ed4NG TH\u1ec2 D\u1ef0 \u00c1N: 7.25 / 10 (M\u1ee9c R\u1ee7i Ro Cao)**\n\n---\n\n# III. 5-8 KHUY\u1ebeN NGH\u1eca K\u1ef8 THU\u1eacT V\u00c0 C\u1ea2NH B\u00c1O CHO K\u1ef8 S\u01af M\u1edaI ONBOARDING\n\nD\u01b0\u1edbi \u0111\u00e2y l\u00e0 c\u00e1c h\u00e0nh \u0111\u1ed9ng b\u1eaft bu\u1ed9c v\u00e0 c\u1ea3nh b\u00e1o d\u00e0nh cho k\u1ef9 s\u01b0 m\u1edbi ti\u1ebfp qu\u1ea3n d\u1ef1 \u00e1n:\n\n### 1. [C\u1ea3nh b\u00e1o] Ki\u1ec3m tra k\u1ef9 lu\u1ed3ng Async/Sync trong Code FastAPI\n*   **S\u1ef1 c\u1ed1 d\u1ec5 g\u1eb7p:** Kh\u00f4ng bao gi\u1edd g\u1ecdi `requests.get()` ho\u1eb7c `psycopg2` query b\u00ean trong m\u1ed9t h\u00e0m `async def` c\u1ee7a FastAPI. N\u00f3 s\u1ebd block to\u00e0n b\u1ed9 server uvicorn.\n*   **H\u00e0nh \u0111\u1ed9ng:** Quy ho\u1ea1ch l\u1ea1i: Lu\u1ed3ng FastAPI ph\u1ea3i d\u00f9ng `httpx.AsyncClient` v\u00e0 `asyncpg`. M\u00e3 ETL/CLI \u0111\u1ed3ng b\u1ed9 ch\u1ea1y ng\u1ea7m m\u1edbi d\u00f9ng `requests`/`psycopg2`.\n\n### 2. [C\u1ea3nh b\u00e1o] C\u1ea9n tr\u1ecdng v\u1edbi h\u1ec7 th\u1ed1ng Git Hooks n\u1ed9i b\u1ed9 (`.claude/hooks`)\n*   **S\u1ef1 c\u1ed1 d\u1ec5 g\u1eb7p:** C\u00e1c hook `pre-commit`, `pre-push`, `post-write` b\u1eb1ng c\u1ea3 Node.js v\u00e0 Python c\u00f3 th\u1ec3 \u00e2m th\u1ea7m reject commit ho\u1eb7c l\u00e0m ch\u1eadm t\u1ed1c \u0111\u1ed9 commit d\u1eef li\u1ec7u do ch\u1ea1y nhi\u1ec1u script ki\u1ec3m tra (`halluc-score`, `drift_check`).\n*   **H\u00e0nh \u0111\u1ed9ng:** \u0110\u1ecdc k\u1ef9 `.claude/hooks/README.md` tr\u01b0\u1edbc khi th\u1ef1c hi\u1ec7n commit \u0111\u1ea7u ti\u00ean. N\u1ebfu g\u1eb7p l\u1ed7i khi commit, h\u00e3y ki\u1ec3m tra xem hook Node.js hay Python \u0111ang th\u1ea5t b\u1ea1i.\n\n### 3. [Khuy\u1ebfn ngh\u1ecb] Chu\u1ea9n h\u00f3a th\u01b0 vi\u1ec7n PostgreSQL Driver cho Production\n*   **H\u00e0nh \u0111\u1ed9ng:** Thay th\u1ebf `psycopg2-binary` b\u1eb1ng `psycopg2` (bi\u00ean d\u1ecbch t\u1eeb source) ho\u1eb7c n\u00e2ng c\u1ea5p l\u00ean `psycopg` v3 trong file `pyproject.toml`/`requirements.txt` \u0111\u1ec3 tr\u00e1nh l\u1ed7i ph\u00e2n b\u1ed5 b\u1ed9 nh\u1edb ho\u1eb7c SSL crash tr\u00ean Production Container.\n\n### 4. [Khuy\u1ebfn ngh\u1ecb] Refactor module \u0111\u01a1n \u0111i\u1ec7u `ops.py`\n*   **H\u00e0nh \u0111\u1ed9ng:** T\u1ec7p `ops.py` (23 functions) hi\u1ec7n t\u1ea1i qu\u00e1 \u00f4m \u0111\u1ed3m. K\u1ef9 s\u01b0 m\u1edbi khi th\u00eam feature kh\u00f4ng n\u00ean ti\u1ebfp t\u1ee5c vi\u1ebft h\u00e0m t\u1ef1 do v\u00e0o \u0111\u00e2y. H\u00e3y t\u00e1ch `ops.py` th\u00e0nh c\u00e1c module nh\u1ecf theo nghi\u1ec7p v\u1ee5 (vd: `ops/gitlab_sync.py`, `ops/db_maintenance.py`) v\u00e0 vi\u1ebft Unit Test b\u1eb1ng `pytest`.\n\n### 5. [Khuy\u1ebfn ngh\u1ecb] Th\u1ed1ng nh\u1ea5t 1 Ng\u00f4n ng\u1eef cho Automation/Tooling Scripts\n*   **H\u00e0nh \u0111\u1ed9ng:** \u0110\u1ec1 xu\u1ea5t v\u1edbi Team lo\u1ea1i b\u1ecf b\u1edbt ph\u1ea7n duplicate code gi\u1eefa Node.js v\u00e0 Python trong th\u01b0 m\u1ee5c `.claude/`. D\u1ef1 \u00e1n l\u00e0 Python (`py311`), \u01b0u ti\u00ean gi\u1eef l\u1ea1i c\u00e1c hook/script vi\u1ebft b\u1eb1ng Python \u0111\u1ec3 t\u1eadn d\u1ee5ng venv chung (`drift_check.py`, `halluc-score.py`) v\u00e0 lo\u1ea1i b\u1ecf runtime Node.js n\u1ebfu kh\u00f4ng c\u1ea7n thi\u1ebft.\n\n### 6. [Khuy\u1ebfn ngh\u1ecb] \u0110\u1ecdc thu\u1ed9c l\u00f2ng `LOCAL_SETUP.md` nh\u01b0ng lu\u00f4n x\u00e1c minh l\u1ea1i th\u1ef1c t\u1ebf\n*   **H\u00e0nh \u0111\u1ed9ng:** T\u00e0i li\u1ec7u `LOCAL_SETUP.md` r\u1ea5t chi ti\u1ebft (48KB) ch\u1ee9ng t\u1ecf setup m\u00f4i tr\u01b0\u1eddng ph\u1ee9c t\u1ea1p. Tuy nhi\u00ean, d\u1ef1 \u00e1n legacy th\u01b0\u1eddng c\u00f3 t\u00e0i li\u1ec7u b\u1ecb out-of-date. Khi setup, n\u1ebfu g\u1eb7p b\u01b0\u1edbc l\u1ed7i, h\u00e3y ch\u1ee7 \u0111\u1ed9ng c\u1eadp nh\u1eadt l\u1ea1i file n\u00e0y (Doc-as-Code) \u0111\u1ec3 gi\u00fap ng\u01b0\u1eddi sau.\n\n### 7. [Khuy\u1ebfn ngh\u1ecb] Gi\u00e1m s\u00e1t ch\u1eb7t ch\u1ebd Pipeline v\u1edbi `dlt` v\u00e0 `dbt`\n*   **H\u00e0nh \u0111\u1ed9ng:** Ki\u1ec3m tra k\u1ef9 c\u00e1c quy t\u1eafc Transformer v\u00e0 Extractor. Ch\u1ea1y l\u1ec7nh ki\u1ec3m tra Drift (`python .claude/hooks/python/drift_check.py` ho\u1eb7c CLI t\u01b0\u01a1ng \u0111\u01b0\u01a1ng) tr\u01b0\u1edbc v\u00e0 sau khi \u0111\u1ed5i c\u1ea5u tr\u00fac database/API \u0111\u1ec3 \u0111\u1ea3m b\u1ea3o `dbt` kh\u00f4ng b\u1ecb g\u00e3y transform models.\n\n# Governance Link\nXem cac luu y quan trong tai [Legacy Caveats](../governance/legacy_caveats.md)."}, "types": ["API Surface", "Architecture", "Business Rule", "Codebase Map", "Database Entity", "Product Spec", "Technical Debt"], "palette": {"BigQuery Dataset": "#8b5cf6", "BigQuery Table": "#3b82f6", "Reference": "#10b981"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
</html>
